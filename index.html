<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice-Cream</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- Top Left Trophy Badge -->
<div class="badge badge-top">
  <div class="badge-icon-yellow">🏆</div>
  <div>
    <div class="badge-text-subtitle">Voted #1 Ice Cream</div>
    <div class="badge-text-title">Best of Summer 2026</div>
  </div>
</div>

<!-- Center Ice Cream Vector (SVG) -->
<svg class="ice-cream-svg" viewBox="0 0 200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Waffle Cone -->
  <polygon points="60,180 140,180 100,290" fill="#F47D31" />
  <line x1="75" y1="200" x2="125" y2="200" stroke="#D95C14" stroke-width="3" stroke-linecap="round" />
  <line x1="85" y1="230" x2="115" y2="230" stroke="#D95C14" stroke-width="3" stroke-linecap="round" />

  <!-- Bottom Scoop (Vanilla / Yellow) -->
  <circle cx="100" cy="160" r="42" fill="#FBF3DB" />

  <!-- Middle Scoop (Pink) -->
  <circle cx="100" cy="120" r="42" fill="#FF5388" />

  <!-- Top Scoop (Purple) -->
  <circle cx="100" cy="80" r="40" fill="#8B5CF6" />

  <!-- Sprinkles on Top Scoop -->
  <!-- Green sprinkle -->
  <rect x="112" y="60" width="10" height="3" rx="1.5" transform="rotate(-30 112 60)" fill="#10B981" />
  <!-- White sprinkle -->
  <rect x="92" y="94" width="10" height="3" rx="1.5" transform="rotate(10 92 94)" fill="#FFFFFF" />
  <!-- Yellow sprinkle -->
  <rect x="114" y="90" width="10" height="3" rx="1.5" transform="rotate(-40 114 90)" fill="#FBBF24" />

  <!-- Cherry Stem -->
  <path d="M100 45 Q115 25 120 18" stroke="#10B981" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Cherry Top -->
  <circle cx="100" cy="45" r="12" fill="#E11D48" />
</svg>

<!-- Center Product Title Pill -->
<div class="pill-label">
  Triple Signature Sundae
</div>

<!-- Bottom Right Strawberry Badge -->
<div class="badge badge-bottom">
  <div class="badge-icon-pink">🍓</div>
<div>
    <div class="badge-text-subtitle">Fresh Daily</div>
    <div class="badge-text-title">Real Fruit Puree</div>
  </div>
</div>

</body>
</html>
